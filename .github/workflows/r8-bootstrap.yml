name: Bootstrap audited r8 source

on:
  push:
    branches: [r8-full-fidelity]
    paths:
      - 'ci/r8-series/**'
      - '.github/workflows/r8-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-audited-series:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: r8-full-fidelity

      - name: Reassemble and verify audited patch archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find ci/r8-series -maxdepth 1 -type f -name 'series.zip.b64.part*' | wc -l)" -eq 8
          cat ci/r8-series/series.zip.b64.part* > /tmp/r8-series.b64
          test "$(wc -c < /tmp/r8-series.b64)" -eq 63060
          base64 -d /tmp/r8-series.b64 > /tmp/r8-series.zip
          echo "191e2f7d10e72a60ed6bbf23b1073807947b50334ba3d11062190f684068de3c  /tmp/r8-series.zip" | sha256sum -c -
          mkdir -p /tmp/r8-series
          unzip -q /tmp/r8-series.zip -d /tmp/r8-series
          test "$(find /tmp/r8-series -maxdepth 1 -type f -name '000*.patch' | wc -l)" -eq 6
          unzip -t /tmp/r8-series.zip

      - name: Apply patches 0001 through 0006
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI DK64 Audit"
          git config user.email "dk64-audit@users.noreply.github.com"
          for p in /tmp/r8-series/000*.patch; do
            echo "::group::Applying $(basename "$p")"
            git am --3way "$p"
            echo "::endgroup::"
          done

      - name: Verify r8 source state
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 5' android/app/build.gradle.kts
          grep -q 'versionName = "1.0.3-android-r8"' android/app/build.gradle.kts
          grep -q 'const std::string version_string = "1.0.3"' src/main/main.cpp
          grep -q 'DK64_RENDERER_COMPAT' android/native/compat/android_paths.cpp
          grep -q 'renderer_compat.txt' android/native/compat/android_paths.cpp
          grep -q 'DEFAULT_ENABLED = true' android/app/src/main/java/com/deivid22srk/dk64recomp/DiagnosticsLogger.java
          grep -q 'DK64DIAG plume:' android/patches/plume-android.patch
          grep -q 'DK64DIAG RT64:' android/patches/rt64-android.patch
          test -f scripts/normalize-dk64-rom.py
          test "$(git ls-tree HEAD lib/rt64 | awk '{print $3}')" = "e437f2a5010b813cf5827b84fa249997ea910903"
          test "$(git ls-tree HEAD lib/N64ModernRuntime | awk '{print $3}')" = "8fe786b52177d087821cf3affb85296f663b508d"
          python3 -m py_compile scripts/normalize-dk64-rom.py
          bash -n scripts/setup-build-inputs-repo.sh
          bash -n scripts/setup-ci-signing.sh
          echo "Audited r8 source verified."
          git --no-pager log --oneline -8

      - name: Restore workflow files for token-safe publish
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's Actions token cannot push commits that modify workflow files.
          # Publish all audited source changes first; ChatGPT's GitHub App will
          # write the final build/release workflows afterward.
          git checkout origin/r8-full-fidelity -- .github/workflows/build.yml .github/workflows/release.yml

      - name: Remove bootstrap transport files
        shell: bash
        run: |
          set -euo pipefail
          git rm -r ci/r8-series .github/workflows/r8-bootstrap.yml
          git add .github/workflows/build.yml .github/workflows/release.yml
          git commit -m "ci: prepare clean r8 source branch"

      - name: Publish clean applied branch
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin HEAD:refs/heads/audit/r8-applied
